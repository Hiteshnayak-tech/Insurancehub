# ====================================
# InsureHub Test Profile
# ====================================
# Uses H2 in-memory database for tests (avoids needing PostgreSQL running)

spring:
  datasource:
    url: jdbc:h2:mem:insurehub_test
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
