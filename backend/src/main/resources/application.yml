# ====================================
# InsureHub Backend Configuration
# ====================================

spring:
  application:
    name: InsureHub

  # --- Database ---
  datasource:
    url: jdbc:h2:mem:insurehub
    username: sa
    password: 
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  # --- JPA / Hibernate ---
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    open-in-view: false

  # --- File Upload ---
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# --- Server ---
server:
  port: 8080

# --- JWT Configuration ---
app:
  jwt:
    secret: ${JWT_SECRET:insureHub2024SecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLong!!}
    expiration-ms: 86400000  # 24 hours

  # --- File Upload Path ---
  upload:
    dir: ${UPLOAD_DIR:./uploads}

# --- Swagger/OpenAPI ---
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
